# Nexwall consolidated log viewer - extra file-based inputs
# These flow through the default ruleset, so they're picked up by the
# same *.* forwarder that already ships everything to VictoriaLogs.
module(load="imfile")

input(type="imfile" File="/var/log/snort/0_alert_json.txt" Tag="snort-ips:" Severity="warning" Facility="local6")
input(type="imfile" File="/var/log/snort/1_alert_json.txt" Tag="snort-ips:" Severity="warning" Facility="local6")
input(type="imfile" File="/var/log/snort/2_alert_json.txt" Tag="snort-ips:" Severity="warning" Facility="local6")
input(type="imfile" File="/var/log/snort/3_alert_json.txt" Tag="snort-ips:" Severity="warning" Facility="local6")

# DPI decisions need no extra input: the firewall logs every blocked flow as a kernel line
# prefixed "DPI block: " (rule in the dpi_actions chain), which the main forwarder already ships.

# Web Protection traffic: every request the proxy handled (allowed, blocked, refused) goes to the log store, so the Web Protection tab
# shows the web traffic. Left out: the proxy's own status polling and the connection peeks that are only the first half of a decision.
input(type="imfile" File="/var/log/squid/access.log" Tag="squid-web:" Severity="info" Facility="local5" ruleset="squid-web")
ruleset(name="squid-web") {
    if ($msg contains "squid-internal-mgr" or $msg contains "/000 ") then {
        stop
    }
    call victoria-logs
}
