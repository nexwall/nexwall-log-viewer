<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIREWALL LOG VIEWER</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{
  --blue:#4f46e5; --blue-dark:#4338ca;
  --red:#ef4444; --red-bg:#fef2f2; --red-text:#b91c1c;
  --green:#059669; --green-bg:#ecfdf5; --green-text:#047857;
  --amber:#d97706; --amber-bg:#fffbeb; --amber-text:#92400e;
  --gray-50:#fafafa; --gray-100:#f3f4f6; --gray-200:#e5e7eb;
  --gray-500:#6b7280; --gray-700:#374151; --gray-900:#111827;
  --border:#e5e7eb; --card:#fff; --bg:#fafafa;
}
@media (prefers-color-scheme: dark){
  :root{
    --red-bg:#3b1414; --red-text:#fca5a5; --green-bg:#0f2a20; --green-text:#6ee7b7; --amber-bg:#33260a; --amber-text:#fcd34d;
    --gray-50:#111827; --gray-100:#1f2937; --gray-200:#374151; --gray-500:#9ca3af; --gray-700:#d1d5db; --gray-900:#f3f4f6;
    --border:#374151; --card:#1f2937; --bg:#111827; --blue-dark:#a5b4fc; --blue:#818cf8;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter Variable",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--gray-900);font-size:13px}
header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:16px;margin:0;font-weight:600;color:var(--gray-900);letter-spacing:.02em}
header h1 span{color:var(--blue-dark)}
header .right{display:flex;gap:12px;align-items:center;font-size:11px;color:var(--gray-500)}
.lang{position:relative}
.lang button{display:flex;align-items:center;padding:6px;border:0;background:none;color:var(--gray-500);cursor:pointer;border-radius:6px}
.lang button:hover{color:var(--gray-900)}
.lang ul{position:absolute;right:0;top:100%;z-index:50;margin:6px 0 0;padding:4px;list-style:none;min-width:170px;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.lang li{padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--gray-700);display:flex;justify-content:space-between;gap:12px}
.lang li:hover{background:var(--gray-100)}
.lang li.on::after{content:"\2713";color:var(--blue-dark)}
.tabs{display:flex;gap:2px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:10px 14px;cursor:pointer;font-weight:500;color:var(--gray-500);border-bottom:2px solid transparent;font-size:12.5px;white-space:nowrap}
.tab.active{color:var(--blue-dark);border-bottom-color:var(--blue-dark)}
.tab.sep{margin-left:18px;border-left:1px solid var(--border)}
.toolbar{display:flex;gap:10px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap}
.toolbar input[type=text],.panel input[type=text],.panel input[type=number]{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--card);color:var(--gray-900)}
.toolbar input[type=text]{flex:1;min-width:220px}
.toolbar select,.toolbar button,.panel select,.panel button{padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:13px;cursor:pointer;color:var(--gray-700)}
button.primary{background:var(--blue);color:#fff!important;border-color:var(--blue)!important}
button.danger{background:var(--red);color:#fff!important;border-color:var(--red)!important}
button:disabled{opacity:.5;cursor:not-allowed}
.toolbar label,.panel label{display:flex;align-items:center;gap:5px;color:var(--gray-700);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px;background:var(--card)}
.chips:not(:empty){padding-bottom:10px}
.chip{background:var(--gray-100);border:1px solid var(--border);border-radius:14px;padding:4px 10px;font-size:12px;display:flex;gap:6px;align-items:center;color:var(--gray-700)}
.chip b{color:var(--gray-900)}
.chip .x{cursor:pointer;color:var(--gray-500);font-weight:700}
.chip .x:hover{color:var(--red)}
/* troubleshooting output: hidden unless the page is opened with ?debug=1, or a request fails */
#debug{display:none;margin:0 20px 10px;padding:8px 12px;background:var(--amber-bg);border:1px solid var(--amber);border-radius:6px;font-size:11px;color:var(--amber-text);font-family:monospace;white-space:pre-wrap;word-break:break-all}
#debug.show{display:block}
.stats{display:flex;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border)}
.stat{flex:1;border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.stat .n{font-size:20px;font-weight:700}
.stat .l{font-size:11px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.03em}
.stat.blocked .n{color:var(--red-text)}
.stat.allowed .n{color:var(--green-text)}
main{padding:0 20px 30px}
.panel{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px}
.panel .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.panel .field{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--gray-500)}
.panel .field input,.panel .field select{width:150px}
.panel .desc{color:var(--gray-500);font-size:12px;margin:0 0 10px}
.panel .status{margin-left:auto;font-size:12px;color:var(--gray-500)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:12px}
thead th{text-align:left;background:var(--gray-100);color:var(--gray-700);font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:9px 10px;border-bottom:1px solid var(--border)}
tbody td{padding:8px 10px;border-bottom:1px solid var(--gray-100);font-size:12.5px;vertical-align:top}
tbody tr:hover{background:var(--gray-50)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.block{background:var(--red-bg);color:var(--red-text)}
.badge.allow{background:var(--green-bg);color:var(--green-text)}
.badge.other{background:var(--amber-bg);color:var(--amber-text)}
.clickable{cursor:pointer;color:var(--blue-dark)}
.clickable:hover{text-decoration:underline}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.msg-toggle{cursor:pointer;color:var(--gray-500);font-size:11px;margin-right:8px}
.msg-full{white-space:pre-wrap;word-break:break-all;color:var(--gray-500);margin-top:4px;font-size:11px}
.reason{color:var(--gray-700)}
.empty{padding:40px;text-align:center;color:var(--gray-500)}
.sev-emerg,.sev-alert,.sev-crit,.sev-err{color:var(--red-text);font-weight:600}
.sev-warning{color:var(--amber-text);font-weight:600}
.sev-notice,.sev-info,.sev-debug{color:var(--gray-700)}
.path{margin:6px 0 0 0;padding:6px 8px;background:var(--gray-100);border-radius:6px;font-size:11px;font-family:ui-monospace,monospace;color:var(--gray-700)}
.path div{white-space:pre-wrap}
footer.note{padding:8px 20px;color:var(--gray-500);font-size:11px}
</style>
</head>
<body>
<header>
  <h1 data-i18n="app.title">FIREWALL LOG VIEWER</h1>
  <div class="right">
    <span id="lastUpdate">—</span>
    <div class="lang" id="langBox">
      <button type="button" id="langBtn" title="Language" aria-label="Language" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 640 512" width="24" height="20" aria-hidden="true"><path fill="currentColor" d="M0 128C0 92.7 28.7 64 64 64l192 0 48 0 16 0 256 0c35.3 0 64 28.7 64 64l0 256c0 35.3-28.7 64-64 64l-256 0-16 0-48 0L64 448c-35.3 0-64-28.7-64-64L0 128zm320 0l0 256 256 0 0-256-256 0zM178.3 175.9c-3.2-7.2-10.4-11.9-18.3-11.9s-15.1 4.7-18.3 11.9l-64 144c-4.5 10.1 .1 21.9 10.2 26.4s21.9-.1 26.4-10.2l8.9-20.1 73.6 0 8.9 20.1c4.5 10.1 16.3 14.6 26.4 10.2s14.6-16.3 10.2-26.4l-64-144zM160 233.2L179 276l-38 0 19-42.8zM448 164c11 0 20 9 20 20l0 4 44 0 16 0c11 0 20 9 20 20s-9 20-20 20l-2 0-1.6 4.5c-8.9 24.4-22.4 46.6-39.6 65.4c.9 .6 1.8 1.1 2.7 1.6l18.9 11.3c9.5 5.7 12.5 18 6.9 27.4s-18 12.5-27.4 6.9l-18.9-11.3c-4.5-2.7-8.8-5.5-13.1-8.5c-10.6 7.5-21.9 14-34 19.4l-3.6 1.6c-10.1 4.5-21.9-.1-26.4-10.2s.1-21.9 10.2-26.4l3.6-1.6c6.4-2.9 12.6-6.1 18.5-9.8l-12.2-12.2c-7.8-7.8-7.8-20.5 0-28.3s20.5-7.8 28.3 0l14.6 14.6 .5 .5c12.4-13.1 22.5-28.3 29.8-45L448 228l-72 0c-11 0-20-9-20-20s9-20 20-20l52 0 0-4c0-11 9-20 20-20z"/></svg>
      </button>
      <ul id="langMenu" role="menu" hidden></ul>
    </div>
  </div>
</header>
<div class="tabs" id="tabsBar"></div>

<!-- search tabs -->
<div class="toolbar" id="searchBar">
  <input type="text" id="freeText" data-i18n-ph="ui.search_ph">
  <select id="timeRange">
    <option value="15m" data-i18n="range.15m"></option>
    <option value="1h" selected data-i18n="range.1h"></option>
    <option value="6h" data-i18n="range.6h"></option>
    <option value="24h" data-i18n="range.24h"></option>
    <option value="7d" data-i18n="range.7d"></option>
  </select>
  <select id="actionFilter" class="action-only">
    <option value="" data-i18n="ui.all_actions"></option>
    <option value="block" data-i18n="ui.only_blocked"></option>
    <option value="allow" data-i18n="ui.only_allowed"></option>
  </select>
  <label class="wp-only" style="display:none"><input type="checkbox" id="wpServices"> <span data-i18n="wp.services"></span></label>
  <label><input type="checkbox" id="autoRefresh" checked> <span data-i18n="ui.auto_refresh"></span></label>
  <button class="primary" id="btnSearch" data-i18n="ui.search"></button>
  <button id="btnClear" data-i18n="ui.clear"></button>
  <button id="btnExport" data-i18n="ui.export"></button>
</div>
<div class="chips" id="chips"></div>
<div id="debug"></div>
<div class="stats" id="statsBar">
  <div class="stat total"><div class="n" id="statTotal">—</div><div class="l" data-i18n="ui.events"></div></div>
  <div class="stat blocked action-only"><div class="n" id="statBlocked">—</div><div class="l" data-i18n="ui.blocked"></div></div>
  <div class="stat allowed action-only"><div class="n" id="statAllowed">—</div><div class="l" data-i18n="ui.allowed"></div></div>
</div>

<!-- live trace tabs -->
<div class="panel" id="tracePanel" style="display:none">
  <p class="desc" id="traceDesc"></p>
  <div class="row">
    <div class="field"><span data-i18n="trace.src_host"></span><input type="text" id="tSrcHost" placeholder="192.168.1.10"></div>
    <div class="field"><span data-i18n="trace.host"></span><input type="text" id="tHost" placeholder="8.8.8.8"></div>
    <div class="field"><span data-i18n="trace.src_net"></span><input type="text" id="tSrcNet" placeholder="192.168.1.0/24"></div>
    <div class="field"><span data-i18n="trace.net"></span><input type="text" id="tNet" placeholder="10.0.0.0/8"></div>
    <div class="field"><span data-i18n="trace.src_port"></span><input type="number" id="tSrcPort" min="1" max="65535" style="width:90px"></div>
    <div class="field"><span data-i18n="trace.port"></span><input type="number" id="tPort" min="1" max="65535" style="width:90px"></div>
    <div class="field"><span data-i18n="trace.proto"></span>
      <select id="tProto" style="width:100px"><option value=""></option><option>tcp</option><option>udp</option><option>icmp</option></select></div>
    <div class="field"><span data-i18n="trace.duration"></span>
      <select id="tSecs" style="width:100px"><option value="15">15 s</option><option value="30" selected>30 s</option><option value="60">60 s</option><option value="120">120 s</option></select></div>
    <label><input type="checkbox" id="tBoth" checked> <span data-i18n="trace.both"></span></label>
    <button class="primary" id="tStart" data-i18n="trace.start"></button>
    <button class="danger" id="tStop" data-i18n="trace.stop" disabled></button>
    <span class="status" id="tStatus"></span>
  </div>
</div>

<main>
  <table id="dataTable">
    <thead id="tableHead"></thead>
    <tbody id="tableBody"><tr><td class="empty" data-i18n="ui.loading"></td></tr></tbody>
  </table>
</main>
<footer class="note" id="footerNote"></footer>

const QS = new URLSearchParams(location.search);

function pickLang(){
  const want = QS.get('lang') || sessionStorage.getItem('nx_logviewer_lang') || navigator.language || 'en';
  if(/^pt/i.test(want)) return 'pt-BR';
  if(/^es/i.test(want)) return 'es';
  return 'en';
}
let LANG = pickLang();
function t(key, vars){
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
  if(vars) for(const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}
function applyStaticI18n(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.getElementById('footerNote').textContent = t('ui.source_note');
  document.title = t('app.title');
  renderLangMenu();
}
const LANG_NAMES = {en:'English', es:'Español', 'pt-BR':'Português (BR)'};
function renderLangMenu(){
  const ul = document.getElementById('langMenu');
  ul.innerHTML = Object.keys(LANG_NAMES).map(c => `<li role="menuitem" data-lang="${c}" class="${c===LANG?'on':''}">${LANG_NAMES[c]}</li>`).join('');
  ul.querySelectorAll('li').forEach(li => li.onclick = () => {
    LANG = li.dataset.lang; sessionStorage.setItem('nx_logviewer_lang', LANG);
    ul.hidden = true; document.getElementById('langBtn').setAttribute('aria-expanded', 'false');
    applyStaticI18n(); selectTab();
  });
}

}

/* --------------------------------------------------------------- helpers */
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function q(s){ return String(s).replace(/"/g,''); }   // safe inside a LogsQL "..." literal

function fwRegex(){
  return '\\s*(?:\\[[^\\]]*\\]\\s*)?(?P<nf_action>[^:\\s][^:]*): IN=(?P<in_if>[^ ]*) OUT=(?P<out_if>[^ ]*).*?SRC=(?P<src_ip>[^ ]+) DST=(?P<dst_ip>[^ ]+).*?PROTO=(?P<proto>[^ ]+)(?: SPT=(?P<spt>[0-9]+) DPT=(?P<dpt>[0-9]+))?';
}
function cleanAction(a){ return String(a||'').replace(/^\s*\[[^\]]*\]\s*/, '').trim(); }   // some kernels prefix "[12345.678]"

function classify(action){
  const a = cleanAction(action).toLowerCase();
  if(/reject|drop|banip|dpi|block|deny/.test(a)) return 'block';
  // a rule that logs its accepted traffic is named by the administrator ("LAN -> WAN"): the arrow, or the words
  // accept / allow / forward, mark traffic the firewall let through
  if(/accept|allow|forward|->/.test(a)) return 'allow';
  return 'other';
}
function classifyIps(action){
  const a = (action||'').toLowerCase();
  return /drop|block|reject/.test(a) ? 'block' : 'other';
}
function badgeLabel(cls){ return cls==='block' ? t('badge.blocked') : (cls==='allow' ? t('badge.allowed') : t('badge.other')); }

// Turns the log prefix the firewall writes ("reject wan in", "DPI block", "banIP/inbound/drop/<list>",
// or the NAME of a rule that has logging on) into a plain-language reason.
function describeReason(prefix){
  const s = cleanAction(prefix);
  let m;
  if(/^dpi\b/i.test(s)) return t('reason.dpi');
  if((m = s.match(/^banIP\/(inbound|outbound)\/(?:drop|reject)\/(.+)$/i))) return t('reason.banip', {dir:t('dir.'+m[1].toLowerCase()), list:m[2]});
  if(/invalid ct state/i.test(s)) return t('reason.invalid');
  if((m = s.match(/^(reject|drop|accept)\s+(\S+)\s+(in|out|forward)$/i))) return t('reason.zone', {action:t('act.'+m[1].toLowerCase()), zone:m[2], dir:t('dir.'+m[3].toLowerCase())});
  return s ? t('reason.rule', {name:s}) : '—';
}
// Reasons produced by fwtrace/drppkt (always English text) -> the viewer language
function tReason(r){
  let m;
  if(!r) return '—';
  if(/^DPI:/.test(r)) return t('reason.dpi');
  if((m = r.match(/^IP & Geo Blocking: matched list (.+)$/))) return t('reason.banip', {dir:'', list:m[1]}).replace('  ',' ');
  if(r === 'IP & Geo Blocking') return t('tab.ipb');
  if(r === 'IPS') return t('reason.ips');
  if(r === 'DNS Filtering') return t('reason.dns');
  if(r === 'Invalid connection state') return t('reason.invalid');
  if(r === 'Established or related connection') return t('reason.established');
  if((m = r.match(/^Zone policy: (.+)$/))) return t('reason.zone_policy', {name:m[1]});
  if((m = r.match(/^Firewall rule: (.+)$/))) return t('reason.rule', {name:m[1]});
  if(/^Default policy/.test(r)) return t('reason.default');
  return r;
}
function macsOf(msg){
  const m = String(msg||'').match(/MAC=([0-9a-f:]{17}):([0-9a-f:]{17}):/i);
  return m ? {dst:m[1], src:m[2]} : null;
}

function buildChipQuery(){ return Object.entries(filters).map(([k,v]) => `${k}:"${q(v)}"`).join(' '); }
function renderChips(){
  const el = document.getElementById('chips');
  el.innerHTML = '';
  for(const [k,v] of Object.entries(filters)){
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `${esc(k)}: <b>${esc(v)}</b> <span class="x" data-k="${esc(k)}">×</span>`;
    el.appendChild(chip);
  }
  el.querySelectorAll('.x').forEach(x => x.onclick = () => { delete filters[x.dataset.k]; renderChips(); runQuery(); });
}
function addFilter(k,v){ filters[k]=v; renderChips(); runQuery(); }

function setDebug(msg, force){
  const d = document.getElementById('debug');
  d.textContent = msg;
  d.classList.toggle('show', DEBUG || !!force);
}

async function vlQuery(query, limit){
  const body = new URLSearchParams();
  body.set('query', query);
  body.set('limit', limit || 300);
  let res;
  try{
    res = await fetch(`${API}/logs/query`, {method:'POST', headers:authHeaders(), body});
  } catch(netErr){
    setDebug(t('ui.error') + ': ' + netErr.message + '\nQuery: ' + query, true);
    throw netErr;
  }
  const text = await res.text();
  if(res.status === 401){
    setDebug(t('ui.session_expired'), true);
    throw new Error(t('ui.session_expired'));
  }
  if(!res.ok){
    setDebug('HTTP ' + res.status + '\nQuery: ' + query + '\n' + text.slice(0,500), true);
    throw new Error('HTTP ' + res.status + ': ' + text.slice(0,200));
  }
  const rows = text.trim().split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch(e){ return null; } }).filter(Boolean);
  setDebug('OK · HTTP ' + res.status + ' · ' + rows.length + ' · ' + activeTab.id + ' · ' + query);
  return rows;
}
async function vlStats(query){
  const body = new URLSearchParams();
  body.set('query', query);
  const res = await fetch(`${API}/logs/query`, {method:'POST', headers:authHeaders(), body});
  const text = await res.text();
  const lines = text.trim().split('\n').filter(Boolean).map(l=>JSON.parse(l));
  return lines[0] ? Number(lines[0].total || 0) : 0;
}

function timeRangeVal(){ return document.getElementById('timeRange').value; }
function freeTextVal(){ return document.getElementById('freeText').value.trim(); }
function setHead(cols){ document.getElementById('tableHead').innerHTML = '<tr>' + cols.map(c=>`<th>${esc(c)}</th>`).join('') + '</tr>'; }
function showActionUI(show){ document.querySelectorAll('.action-only').forEach(el => el.style.display = show ? '' : 'none'); document.querySelectorAll('.wp-only').forEach(el => el.style.display = 'none'); }
function setBody(html){ document.getElementById('tableBody').innerHTML = html; }
function emptyRow(cols, msg){ setBody(`<tr><td colspan="${cols}" class="empty">${esc(msg)}</td></tr>`); }
function stamp(label){ document.getElementById('lastUpdate').textContent = label; }

async function withStats(rowsPromise, render, countQ, blockedQ){
  stamp(t('ui.updating'));
  try{
    const rows = await rowsPromise();
    render(rows);
    document.getElementById('statTotal').textContent = await vlStats(countQ);
    if(blockedQ){
      const total = Number(document.getElementById('statTotal').textContent);
      const blocked = await vlStats(blockedQ);
      document.getElementById('statBlocked').textContent = blocked;
      document.getElementById('statAllowed').textContent = Math.max(total - blocked, 0);
    }
  } catch(e){
    setBody(`<tr><td class="empty">${esc(t('ui.error'))}: ${esc(e.message)}</td></tr>`);
  }
  stamp(t('ui.updated') + ' ' + new Date().toLocaleTimeString(LOCALES[LANG]));
}

/* -------------------------------------------------------- netfilter tabs */
async function runNetfilterTab(){
  const tab = activeTab;
  const actionSel = document.getElementById('actionFilter').value;
  let base = `_time:${timeRangeVal()} app_name:kernel`;
  if(freeTextVal()) base += ` "${q(freeTextVal())}"`;
  const chipQ = buildChipQuery();
  let core = `${base} | extract_regexp \`${fwRegex()}\` | filter nf_action:*`;
  if(tab.extra) core += ` | filter (${tab.extra})`;
  if(chipQ) core += ` | filter (${chipQ})`;
  const BLK = 'nf_action:~"(?i)reject|drop|banip|dpi|block"';
  let qy = core;
  if(actionSel === 'block') qy += ` | filter (${BLK})`;
  if(actionSel === 'allow') qy += ' | filter (nf_action:~"(?i)accept|allow|forward|->" AND NOT ' + BLK + ')';
  qy += ' | sort by (_time) desc';

  const cols = [t('col.time'), t('col.action'), t('col.reason'), t('col.source'), t('col.destination'), t('col.protocol'), t('col.interface'), ''];
  setHead(cols); showActionUI(!tab.blockOnly);
  await withStats(() => vlQuery(qy, 300), renderNetfilterRows, `${core} | stats count() as total`, `${core} | filter (${BLK}) | stats count() as total`);
}

async function runAuthTab(){

function parseAuth(r){
  const m = String(r._msg||'');
  let x;
  if(r.app_name === 'dropbear'){
    if((x = m.match(/Password auth succeeded for '([^']*)' from ([0-9a-fA-F:.]+)/))) return {ok:true, user:x[1], ip:x[2], via:'SSH'};
    if((x = m.match(/Bad password attempt for '([^']*)' from ([0-9a-fA-F:.]+)/))) return {ok:false, user:x[1], ip:x[2], via:'SSH'};
    if((x = m.match(/Login attempt for nonexistent user (?:'([^']*)' )?from ([0-9a-fA-F:.]+)/))) return {ok:false, user:x[1]||'?', ip:x[2], via:'SSH'};
    return null;
  }
  if((x = m.match(/authentication success for user ([^ ]+)(?: from ([0-9a-fA-F:.<>ip]+))?/))) return {ok:true, user:x[1], ip:x[2]||'', via:'Web'};
  if((x = m.match(/authentication failed for user ([^ ]+)(?: from ([0-9a-fA-F:.<>ip]+))?/))) return {ok:false, user:x[1], ip:x[2]||'', via:'Web'};
  return null;
}
function renderAuthRows(rows){
  const items = rows.map(r => ({r, a:parseAuth(r)})).filter(x => x.a);

  setBody(items.map(({r,a}) => `<tr>

let trace = {id:null, timer:null, next:0, count:0, rows:[]};
function traceFormBody(){

  if(v('tSrcPort')) body.src_port = Number(v('tSrcPort'));
  if(v('tProto')) body.proto = v('tProto');
  return body;
}
function traceSetRunning(on){
  document.getElementById('tStart').disabled = on;
  document.getElementById('tStop').disabled = !on;
}
function traceHead(){
  setHead([t('col.time'), t('col.protocol'), t('col.source'), t('col.destination'), t('col.decision'), t('col.rule'), t('col.reason')]);
}
async function traceStart(){
  const body = traceFormBody();
  if(!(body.host||body.src_host||body.net||body.src_net||body.port||body.src_port||body.proto)){
    document.getElementById('tStatus').textContent = t('trace.need_filter'); return;
  }
  traceStop(true);
  trace = {id:null, timer:null, next:0, count:0, rows:[]};
  traceHead();
  setBody(`<tr><td colspan="7" class="empty">${esc(t('trace.none'))}</td></tr>`);
  let res, data;
  try{
    res = await fetch(`${API}/trace/start`, {method:'POST', headers:authHeaders({'Content-Type':'application/json'}), body:JSON.stringify(body)});
    data = await res.json();
  } catch(e){ document.getElementById('tStatus').textContent = t('trace.err') + ': ' + e.message; return; }
  if(res.status === 401){ document.getElementById('tStatus').textContent = t('ui.session_expired'); return; }
  if(res.status === 409){ document.getElementById('tStatus').textContent = t('trace.busy'); return; }
  if(!res.ok){ document.getElementById('tStatus').textContent = t('trace.err') + ': ' + (data.message||res.status); return; }
  trace.id = data.data.id;
  traceSetRunning(true);
  document.getElementById('tStatus').textContent = t('trace.running', {n:0});
  trace.timer = setInterval(tracePoll, 1000);
  tracePoll();
}
async function tracePoll(){
  if(!trace.id) return;
  let d;
  try{
    const res = await fetch(`${API}/trace/${trace.id}?since=${trace.next}`, {headers:authHeaders()});
    d = (await res.json()).data;
  } catch(e){ return; }
  if(!d) return;
  d.lines.forEach(l => { try { trace.rows.push(JSON.parse(l)); } catch(e){} });
  trace.next = d.next;
  renderTraceRows();
  document.getElementById('tStatus').textContent = d.running ? t('trace.running', {n:traceShown().length}) : (t('trace.finished', {n:traceShown().length}) + (d.error ? ' · ' + d.error.trim() : ''));
  if(!d.running){ clearInterval(trace.timer); trace.timer = null; traceSetRunning(false); }
}
function traceStop(silent){
  if(trace.timer){ clearInterval(trace.timer); trace.timer = null; }
  if(trace.id){
    fetch(`${API}/trace/${trace.id}/stop`, {method:'POST', headers:authHeaders()}).catch(()=>{});
    if(!silent) tracePoll();
  }
  traceSetRunning(false);
}
function traceShown(){

/* ------------------------------------------------------- Web Protection tab */
// Decisions of Web Protection: block pages of category rules, files stopped by the antivirus or the sandbox, requests the proxy refused.
// Sources: syslog (nexwall-av, nexwall-sandbox, nexwall-web-*) and the proxy's refusals (squid-web, added by nexwall-extra.conf).
const WEBPROT_SERVICES_Q = 'app_name:~"(?i)^nexwall-(av|sandbox|web.*|gate)"';
const WEBPROT_DECISIONS_Q = '(app_name:~"(?i)^nexwall-(av|sandbox|web.*|gate)" ("page-blocked" OR "blocked client" OR "verdict sha="))';
const WEBPROT_ALLOWED = '_msg:~"(TCP_TUNNEL|TCP_MISS|TCP_HIT|TCP_REFRESH|TCP_MEM_HIT|TCP_NEGATIVE_HIT)/[23]"';
const WEBPROT_BLOCKED = '("page-blocked" OR "blocked client" OR _msg:~"TCP_DENIED|/40[39] |/5[0-9][0-9] " OR "verdict=malicious")';
function classifyWebProt(r){
  const m = String(r._msg||'');
  let x;
  if((x = m.match(/page-blocked client=(\S+) host=(\S+) category=(\S+)(?: ref=(\S+))? rule=(.*)$/)))
    return {ev:'page', cls:'block', client:x[1], target:x[2],
            detail: t('wp.detail_category', {cat:x[3], rule:x[5].trim()}) + (x[4] ? ' · ' + t('wp.ref') + ' ' + x[4] : '')};
  if((x = m.match(/blocked client=(\S+) reason=(\S+)(?: (.*?))? size=\d+/)))
    return {ev: x[2] === 'sandbox' ? 'sandbox' : 'av', cls:'block', client:x[1], target:'', detail: x[2] + (x[3] ? ': ' + x[3] : '')};
  if((x = m.match(/verdict sha=(\S+) verdict=(\S+) client=(\S*) name=(.*)$/)))
    return {ev:'verdict', cls: x[2] === 'malicious' ? 'block' : (x[2] === 'suspicious' ? 'other' : 'allow'), client:x[3], target:x[4], detail:x[2] + ' · ' + x[1]};
  if(r.app_name === 'squid-web' && (x = m.match(/^\s*\d+\.\d+\s+\d+\s+(\S+)\s+(\S+)\/(\d{3})\s+\d+\s+(\S+)\s+(\S+)/))){
    const code = x[3], res = x[2], host = x[5].replace(/^https?:\/\//, '').replace(/[\/?].*$/, '');
    if(code === '409') return {ev:'proxy', cls:'other', client:x[1], target:host, detail:t('wp.proxy_409') + ' · ' + res + '/' + code};
    if(code === '403' || /DENIED/.test(res)) return {ev:'web_blocked', cls:'block', client:x[1], target:host, detail:res + '/' + code};
    if(/^5/.test(code)) return {ev:'proxy', cls:'other', client:x[1], target:host, detail:t('wp.proxy_other', {code}) + ' · ' + res + '/' + code};
    if(/TUNNEL/.test(res)) return {ev:'web_tunnel', cls:'allow', client:x[1], target:host, detail:t('wp.detail_tunnel') + ' · ' + res + '/' + code};
    return {ev:'web_allowed', cls:'allow', client:x[1], target:host, detail:t('wp.detail_inspected') + ' · ' + x[4] + ' ' + res + '/' + code};
  }
  return {ev:'service', cls:'other', client:'', target:'', detail:m};
}
async function runWebProtTab(){
  const services = document.getElementById('wpServices').checked;
  const actionSel = document.getElementById('actionFilter').value;
  let sel = services ? `(app_name:squid-web OR ${WEBPROT_SERVICES_Q})` : `(app_name:squid-web OR ${WEBPROT_DECISIONS_Q})`;
  let core = `_time:${timeRangeVal()} ${sel}` + (freeTextVal() ? ` "${q(freeTextVal())}"` : '');
  const chipQ = buildChipQuery();
  if(chipQ) core += ` ${chipQ}`;
  if(actionSel === 'block') core += ` ${WEBPROT_BLOCKED}`;
  if(actionSel === 'allow') core += ` ${WEBPROT_ALLOWED}`;
  setHead([t('col.time'), t('col.event'), t('col.client'), t('col.target'), t('col.message')]);
  showActionUI(true);
  document.querySelectorAll('.wp-only').forEach(el => el.style.display = '');
  await withStats(() => vlQuery(`${core} | sort by (_time) desc`, 300), renderWebProtRows, `${core} | stats count() as total`);
}
function renderWebProtRows(rows){
  if(!rows.length){ emptyRow(5, t('empty.webprot')); return; }
  setBody(rows.map((r, i) => {
    const c = classifyWebProt(r);
    return `<tr>
      <td class="mono">${esc(fmtDate(r._time))}</td>
      <td><span class="badge ${c.cls}">${esc(t('wp.ev.' + c.ev))}</span></td>
      <td class="mono ${c.client ? 'clickable' : ''}" data-k="freeText" data-v="${esc(c.client)}">${esc(c.client || '—')}</td>
      <td class="mono">${esc(c.target || '—')}</td>
      <td>${esc(c.detail)} <span class="msg-toggle" data-i="${i}">${esc(t('ui.raw'))}</span><div class="msg-full" id="msg-${i}" style="display:none">${esc(r._msg)}</div></td>
    </tr>`;
  }).join(''));
  bindRowInteractions();
}

/* ---------------------------------------------------------------- shell */
function bindRowInteractions(){
  const body = document.getElementById('tableBody');
  body.querySelectorAll('.clickable').forEach(el => el.onclick = () => {
    if(!el.dataset.v) return;
    if(el.dataset.k === 'freeText'){ document.getElementById('freeText').value = el.dataset.v; runQuery(); return; }
    addFilter(el.dataset.k, el.dataset.v);
  });
  body.querySelectorAll('.msg-toggle:not(.traceit)').forEach(el => el.onclick = () => {
    const d = document.getElementById('msg-'+el.dataset.i);
    if(d) d.style.display = d.style.display === 'none' ? 'block' : 'none';
  });
  body.querySelectorAll('.traceit').forEach(el => el.onclick = () => openTraceFrom(el));
}

function runQuery(){
  switch(activeTab.kind){
    case 'netfilter': return runNetfilterTab();
    case 'flows': return runFlowsTab();
    case 'ips': return runIpsTab();
    case 'nginx': return runNginxTab();
    case 'auth': return runAuthTab();
    case 'admin': return runAdminTab();
    case 'webprot': return runWebProtTab();
    case 'trace': return;   // driven by its own Start button
    default: return runSimpleTab();
  }
}
function selectTab(){
  filters = {}; renderChips(); renderTabsBar();
  const isTrace = activeTab.kind === 'trace';
  document.getElementById('searchBar').style.display = isTrace ? 'none' : '';
  document.getElementById('statsBar').style.display = isTrace ? 'none' : '';
  document.getElementById('chips').style.display = isTrace ? 'none' : '';
  document.getElementById('tracePanel').style.display = isTrace ? '' : 'none';
  if(isTrace){
    document.getElementById('traceDesc').textContent = t(activeTab.desc || (activeTab.tool === 'fwtrace' ? 'trace.desc_fw' : 'trace.desc_dr'));
    traceHead(); renderTraceRows();
    document.getElementById('tStatus').textContent = '';
  } else {
    traceStop(true);
    runQuery();
  }
  setupAutoRefresh();
}
function renderTabsBar(){
  const bar = document.getElementById('tabsBar');
  bar.innerHTML = TABS.map(tab => `<div class="tab${tab===activeTab?' active':''}${tab.sep?' sep':''}" data-id="${tab.id}">${esc(tabLabel(tab))}</div>`).join('');
  bar.querySelectorAll('.tab').forEach(el => el.onclick = () => { activeTab = TABS.find(x => x.id === el.dataset.id); selectTab(); });
}
function setupAutoRefresh(){
  if(timer) clearInterval(timer);
  timer = null;
  if(activeTab.kind !== 'trace' && document.getElementById('autoRefresh').checked) timer = setInterval(runQuery, 10000);
}

function exportCsv(){
  const rows = [...document.querySelectorAll('#dataTable tr')].map(tr => [...tr.children].map(td => td.innerText.replace(/\s+/g,' ').trim()));
  if(rows.length < 2) return;
  const csv = rows.map(r => r.map(c => '"' + c.replace(/"/g,'""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type:'text/csv;charset=utf-8'}));
  a.download = `nexwall-${activeTab.id}-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.getElementById('btnSearch').onclick = runQuery;
document.getElementById('timeRange').onchange = runQuery;
document.getElementById('actionFilter').onchange = runQuery;
document.getElementById('wpServices').onchange = runQuery;
document.getElementById('freeText').addEventListener('keydown', e => { if(e.key==='Enter') runQuery(); });
document.getElementById('btnClear').onclick = () => { filters={}; document.getElementById('freeText').value=''; document.getElementById('actionFilter').value=''; renderChips(); runQuery(); };
document.getElementById('btnExport').onclick = exportCsv;
document.getElementById('autoRefresh').onchange = setupAutoRefresh;
document.getElementById('tStart').onclick = traceStart;
document.getElementById('tStop').onclick = () => traceStop(false);
document.getElementById('langBtn').onclick = e => {
  e.stopPropagation();
  const ul = document.getElementById('langMenu');
  ul.hidden = !ul.hidden;
  e.currentTarget.setAttribute('aria-expanded', String(!ul.hidden));
};
document.addEventListener('click', () => { document.getElementById('langMenu').hidden = true; });
// opened as a window of its own: use the whole screen
try { window.moveTo(0, 0); window.resizeTo(screen.availWidth, screen.availHeight); } catch(e) {}
window.addEventListener('beforeunload', () => traceStop(true));

applyStaticI18n();
selectTab();
</script>
